name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    name: python
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test deps
        run: python -m pip install --upgrade pip pytest
      - name: Hub self-test
        run: python hub/cinenode-hub.py --self-test
      - name: Pytest
        env:
          HUB_PATH: hub/cinenode-hub.py
        run: python -m pytest hub/tests -q --tb=short

  node:
    name: node
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck

  ci:
    name: ci
    needs: [python, node]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require python and node
        run: |
          test "${{ needs.python.result }}" = "success"
          test "${{ needs.node.result }}" = "success"
